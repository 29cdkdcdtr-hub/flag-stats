<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d3b24">
<title>フラッグスタッツ</title>
<style>
/*
  v3 デザイン「サイドラインの白線」
  - 試合中は屋外・片手。明るい白地に濃い緑の文字で、日差しの下でもはっきり読める
  - 上のスコアボードは芝の緑に白線。ダウンは4つのマスで、何回目か一目で分かる
  - チームの色：自チーム＝パイロンのオレンジ、相手＝青。攻撃中のチームはその色の帯で示す
  - 黄色は「反則」だけに使う（アメフトの反則の旗の色）
  - 外部の文字ファイルは読み込まない（電波がなくても同じ見た目）
*/
:root{
  --chalk:#f6f8f4; --paper:#ffffff; --ink:#0f2a1c; --ink-2:#4a5f52; --rule:#cfd9d1; --wash:#e8eee9;
  --turf:#0b6b3a; --turf-ink:#ffffff; --turf-deep:#0d3b24; --turf-line:rgba(255,255,255,.14);
  --team-A:#f05a12; --team-B:#1f55c9;
  --penalty:#ffd21f; --penalty-ink:#2b2300;
  --good:#0b6b3a; --good-bg:#dff1e6; --bad:#c5282f; --bad-bg:#fbe4e4;
  --board-ink:#ffffff; --board-dim:#a9cdb7;
  --f-num:"DIN Alternate","DIN Condensed","Bahnschrift","Roboto Condensed","Arial Narrow",sans-serif;
  --f-body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;
  --r-s:8px; --r-m:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --chalk:#08150e; --paper:#10211a; --ink:#e9f2ec; --ink-2:#9db3a5; --rule:#24382c; --wash:#173024;
  --turf:#2fa565; --turf-ink:#03130a; --turf-deep:#062a18;
  --team-A:#ff7a3a; --team-B:#5b8cff;
  --good:#45c27f; --good-bg:#12301f; --bad:#ff6b6b; --bad-bg:#3a1618;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --chalk:#08150e; --paper:#10211a; --ink:#e9f2ec; --ink-2:#9db3a5; --rule:#24382c; --wash:#173024;
  --turf:#2fa565; --turf-ink:#03130a; --turf-deep:#062a18;
  --team-A:#ff7a3a; --team-B:#5b8cff;
  --good:#45c27f; --good-bg:#12301f; --bad:#ff6b6b; --bad-bg:#3a1618;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--chalk);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--chalk)}
body[data-view="game"]::before{background:var(--turf-deep)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:560px;margin:0 auto}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:700}
h1,h2,h3{text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid var(--team-B);outline-offset:2px}
.tA{--tc:var(--team-A)} .tB{--tc:var(--team-B)}

/* ---------- 上の見出し ---------- */
.top{padding-block:22px 4px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:46px;height:46px;flex:none}
.brand h1{font-size:24px;font-weight:800;letter-spacing:.02em;line-height:1.2}
.brand .grow{flex:1;min-width:0}
.brand p{margin:0;color:var(--ink-2);font-size:13px}
.bar{display:flex;align-items:center;gap:6px;padding-block:12px 4px}
.bar h1{font-size:20px;font-weight:800}
.backbtn{min-width:48px;min-height:48px;border:0;background:transparent;font-size:32px;line-height:1;border-radius:var(--r-s);cursor:pointer;color:var(--ink)}

.wrap{padding-block:10px 56px;display:flex;flex-direction:column;gap:14px}
.sec{font-size:15px;font-weight:800;margin-top:14px;padding-left:10px;border-left:4px solid var(--turf);line-height:1.3}
.note{color:var(--ink-2);font-size:13px;margin:0}
.empty{color:var(--ink-2);margin:0;padding:22px;border:2px dashed var(--rule);border-radius:var(--r-m);text-align:center}

/* ---------- ボタン ---------- */
.btn{min-height:52px;padding:0 16px;border-radius:var(--r-m);border:2px solid var(--rule);background:var(--paper);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;touch-action:manipulation;color:var(--ink)}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--turf);border-color:var(--turf);color:var(--turf-ink)}
.btn.flag{background:var(--penalty);border-color:var(--penalty);color:var(--penalty-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.btn.good{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.btn.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.btn.big{min-height:60px;font-size:18px;width:100%}
.btn.huge{min-height:88px;font-size:24px;flex-direction:column;gap:0;line-height:1.2;font-weight:800}
.btn.huge small{font-size:13px;font-weight:600;opacity:.85}
.row{display:flex;flex-wrap:wrap;gap:8px}
.row .btn{flex:1 1 auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- 試合一覧 ---------- */
.gcard{background:var(--paper);border:2px solid var(--rule);border-radius:var(--r-m);padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px}
.gmeta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--ink-2);font-size:13px;font-weight:600}
.tag{background:var(--wash);color:var(--ink);border-radius:var(--r-s);padding:0 8px;font-weight:700;font-size:12px}
.gscore{display:grid;grid-template-columns:1fr auto auto auto 1fr;align-items:center;gap:10px}
.gscore .tn{font-weight:800;min-width:0;overflow-wrap:anywhere;padding-left:10px;border-left:5px solid var(--tc)}
.gscore .tn.r{text-align:right;padding-left:0;padding-right:10px;border-left:0;border-right:5px solid var(--tc)}
.gscore b{font-size:40px;line-height:1}
.gscore i{color:var(--ink-2);font-style:normal}
.gact{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
.gact .ghost{padding:0 8px}

/* ---------- 入力フォーム ---------- */
.form{display:flex;flex-direction:column;gap:16px}
.form label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px}
.form input[type=date],.form input:not([type]),.form input[type=text]{min-height:54px;border:2px solid var(--rule);border-radius:var(--r-m);padding:0 14px;font:inherit;font-size:17px;font-weight:500;background:var(--paper);color:var(--ink)}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
legend{font-weight:700;font-size:15px;padding:0;margin-bottom:6px}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg2 label{display:block}
.seg2 input{position:absolute;opacity:0;pointer-events:none}
.seg2 span{display:flex;min-height:54px;align-items:center;justify-content:center;border:2px solid var(--rule);border-radius:var(--r-m);background:var(--paper);font-weight:700;cursor:pointer}
.seg2 input:checked+span{background:var(--turf);border-color:var(--turf);color:var(--turf-ink)}
.seg2 input:focus-visible+span{outline:3px solid var(--team-B);outline-offset:2px}
details{border:2px solid var(--rule);border-radius:var(--r-m);padding:0 14px;background:var(--paper)}
details[open]{padding-bottom:14px}
summary{min-height:50px;display:flex;align-items:center;font-weight:700;cursor:pointer;color:var(--ink-2)}
details label{margin-top:10px}

/* ---------- 背番号の登録 ---------- */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tab{min-height:60px;border:2px solid var(--rule);border-top:6px solid var(--tc);border-radius:var(--r-m);background:var(--paper);font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.3;min-width:0;padding:4px 8px;overflow-wrap:anywhere}
.tab small{font-weight:600;color:var(--ink-2);font-size:12px}
.tab.on{background:var(--tc);border-color:var(--tc);color:#fff}
.tab.on small{color:inherit;opacity:.9}
.picked{margin:0;min-height:50px;padding:10px 14px;background:var(--wash);border-radius:var(--r-m);font-size:14px}
.picked b{font-size:20px}
.ngrid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.nb{aspect-ratio:1;max-width:100%;border:1px solid var(--rule);background:var(--paper);border-radius:6px;font-family:var(--f-num);font-weight:700;font-size:clamp(15px,4.4vw,21px);cursor:pointer;padding:0;touch-action:manipulation;color:var(--ink)}
.nb.on{background:var(--ink);border-color:var(--ink);color:var(--chalk)}

/* ---------- スコアボード（芝と白線） ---------- */
.board{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;color:var(--board-ink);padding-block:6px 12px;
  background:
    repeating-linear-gradient(90deg,transparent 0 calc(20% - 2px),var(--turf-line) calc(20% - 2px) 20%),
    var(--turf-deep)}
.brow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.iconbtn{min-height:44px;min-width:48px;padding:0 14px;border-radius:var(--r-s);border:2px solid rgba(255,255,255,.35);background:transparent;color:var(--board-ink);font-weight:700;cursor:pointer;font-size:15px}
.iconbtn.back{font-size:30px;line-height:1;border-color:transparent;padding:0 8px}
.half{font-weight:800;font-size:15px;color:var(--turf-deep);background:#fff;border-radius:999px;padding:2px 14px}
.sc{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:6px;margin-top:6px}
.st{display:flex;flex-direction:column;align-items:center;min-width:0;padding:6px 4px 4px;border-radius:var(--r-m);border-top:6px solid var(--tc);background:rgba(0,0,0,.18)}
.st.att{background:rgba(255,255,255,.1)}
.stn{font-size:14px;color:var(--board-dim);font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st.att .stn{color:var(--board-ink)}
.st .big{font-size:64px;line-height:1;letter-spacing:-.01em}
.ball{font-size:12px;font-weight:800;border-radius:999px;padding:1px 10px;margin-top:2px;background:var(--tc);color:#fff;visibility:hidden}
.st.att .ball{visibility:visible}
.dash{color:var(--board-dim);font-size:28px;align-self:center}
.downs{display:grid;grid-template-columns:auto repeat(4,1fr);align-items:center;gap:6px;margin-top:10px}
.downs .dl{font-size:15px;font-weight:800;padding-right:4px;white-space:nowrap}
.downs i{font-style:normal;font-family:var(--f-num);font-weight:700;font-size:18px;height:34px;display:grid;place-items:center;border-radius:6px;border:2px solid rgba(255,255,255,.35);color:var(--board-dim)}
.downs i.used{background:rgba(255,255,255,.16);border-color:transparent;color:rgba(255,255,255,.55)}
.downs i.now{background:#fff;border-color:#fff;color:var(--turf-deep);font-size:22px}
.downs i.now.last{background:var(--bad);border-color:var(--bad);color:#fff}
.poss{margin:6px 0 0;font-size:13px;color:var(--board-dim);text-align:center}
.poss b{color:var(--board-ink)}

/* ---------- プレーの入力 ---------- */
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.types .btn{min-height:68px;font-size:20px;font-weight:800}
.types .main{min-height:112px;font-size:32px;flex-direction:column;gap:2px;border-radius:18px}
.types .main small{font-size:13px;font-weight:600;opacity:.9}
.types .pen{background:var(--penalty);border-color:var(--penalty);color:var(--penalty-ink)}
.klist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.klist .btn{min-height:58px;font-size:15px;padding:6px 10px;line-height:1.3}
.klist .btn.wide{grid-column:1/-1}
.ask{margin:0;padding:10px 12px;background:var(--wash);border-radius:var(--r-s);font-size:14px}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tools .btn{min-height:50px;font-size:15px}
.tools .bad{grid-column:1/-1}
.draft{background:var(--paper);border:2px solid var(--ink);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px}
.crumbs span{background:var(--wash);border-radius:var(--r-s);padding:2px 10px;font-size:14px;font-weight:700}
.crumbs span:first-child{background:var(--ink);color:var(--chalk)}
.q{font-size:21px;font-weight:800;line-height:1.35}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pb{min-height:72px;border:2px solid var(--rule);border-radius:var(--r-m);background:var(--chalk);font-family:var(--f-num);font-weight:700;font-size:34px;cursor:pointer;touch-action:manipulation;color:var(--ink)}
.pb.hi{border:3px solid var(--ink)}
.ygrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.yb{min-height:54px;border:2px solid var(--rule);border-radius:var(--r-s);background:var(--chalk);font-family:var(--f-num);font-weight:700;font-size:22px;cursor:pointer;padding:0;touch-action:manipulation;color:var(--ink)}
.yb.neg{color:var(--bad)}
.yb.zero{background:var(--wash)}
.td{min-height:68px;font-size:26px;width:100%;font-weight:800;letter-spacing:.04em;background:var(--turf);border-color:var(--turf);color:var(--turf-ink)}

/* ---------- 記録の一覧 ---------- */
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:2px solid var(--ink)}
.log li{border-bottom:1px solid var(--rule);min-width:0}
.lb{display:grid;grid-template-columns:40px 1fr auto;gap:10px;padding:10px 2px 10px 10px;width:100%;text-align:left;background:none;border:0;border-left:5px solid var(--tc,transparent);cursor:pointer;align-items:baseline;min-height:52px;color:var(--ink)}
.lb .more{color:var(--ink-2);font-size:18px}
.log .void .t{text-decoration:line-through;color:var(--ink-2)}
.ptag{display:inline-block;background:var(--penalty);color:var(--penalty-ink);border-radius:4px;padding:0 6px;font-size:12px;font-weight:800;margin-right:6px}
.log .h{font-size:12px;color:var(--ink-2);font-weight:700}
.log .t{min-width:0;overflow-wrap:anywhere}
.log .tm{display:block;font-size:12px;color:var(--ink-2)}
.log .ev .t{color:var(--ink-2)}
.log .scored{font-weight:800}
.log .scored::before{content:"得点";display:inline-block;background:var(--turf);color:var(--turf-ink);border-radius:4px;padding:0 6px;font-size:12px;margin-right:6px}

/* ---------- スタッツ ---------- */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--wash);padding:4px;border-radius:var(--r-m)}
.seg button{min-height:46px;border:0;border-radius:10px;background:transparent;font-weight:700;cursor:pointer;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 8px}
.seg button.on{background:var(--paper);color:var(--ink);outline:2px solid var(--ink)}
.seg.teams button.on{background:var(--tc);color:#fff;outline:0}
.sumbox{color:var(--board-ink);border-radius:var(--r-m);padding:14px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center;
  background:repeating-linear-gradient(90deg,transparent 0 calc(20% - 2px),var(--turf-line) calc(20% - 2px) 20%),var(--turf-deep)}
.sumbox>div{border-top:5px solid var(--tc);padding-top:6px}
.sumbox .stn{white-space:normal;color:var(--board-ink)}
.sumbox b{font-size:52px;line-height:1;display:block}
.sumbox .dash{color:var(--board-dim)}
.tw{overflow-x:auto;border:2px solid var(--rule);border-radius:var(--r-m);background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--rule)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--paper)}
thead th{font-size:12px;color:var(--ink-2);font-weight:700;background:var(--wash)}
thead th:first-child{background:var(--wash)}
tbody tr:last-child td{border-bottom:0}
td{font-variant-numeric:tabular-nums;font-family:var(--f-num);font-size:18px}
td .num{font-size:20px}
.h3{font-size:16px;font-weight:800;margin:8px 0 -4px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:0;background:var(--paper);border:2px solid var(--rule);border-radius:var(--r-m);overflow:hidden}
.kv div{padding:10px 12px;min-width:0;border-bottom:1px solid var(--rule);margin-bottom:-1px}
.kv div:nth-child(even){border-right:1px solid var(--rule)}
.kv span{display:block;font-size:12px;color:var(--ink-2);font-weight:700;line-height:1.4}
.kv b{font-size:28px;line-height:1.2}
.kv .lead{grid-column:1/-1;border-right:0!important;background:var(--wash)}
.kv .lead b{font-size:40px}
textarea{width:100%;min-height:140px;border:2px solid var(--rule);border-radius:var(--r-m);padding:10px;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--paper);color:var(--ink)}

/* ---------- 確認の画面・お知らせ ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,20,12,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet p{margin:0;font-size:17px;font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--chalk);padding:12px 20px;border-radius:var(--r-m);font-weight:700;font-size:15px;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.draft{animation:rise .16s ease-out}@keyframes rise{from{transform:translateY(8px);opacity:.5}}}
@media (max-width:360px){.st .big{font-size:52px}.types .main{font-size:28px}}
</style>

<div id="app"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
const KEY='ffstats.v1';
const other=t=>t==='A'?'B':'A';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const sgn=n=>n>0?'+'+n:String(n);
const fmtDate=s=>{const [y,m,d]=String(s).split('-').map(Number);const w='日月火水木金土'[new Date(y,m-1,d).getDay()]||'';return `${y}年${m}月${d}日(${w})`};
const TYPE={pass:'パス',run:'ラン',int:'インター',sack:'サック',safety:'セーフティ'};
const DOWN={repeat:'ダウンそのまま',first:'ダウン更新',loss:'ダウン消費'};
const DOWN_LONG={repeat:'ダウンそのまま（同じダウンをやり直し）',first:'ダウン更新（第1ダウンへ）',loss:'ダウン消費（ロス・オブ・ダウン）'};
const PEN_DEFAULT=['フォルススタート','オフサイド','ラッシュ妨害','パス妨害','ディレイ・オブ・ゲーム','フラッグガード','不正なコンタクト','不正な前パス','スポーツマンらしくない行為','その他'];

/* ---------- state ---------- */
const voidSet=g=>new Set(g.plays.filter(p=>p.type==='pen'&&p.voidId).map(p=>p.voidId));
function replay(g){
  const s={half:1,poss:g.first,down:1,score:{A:0,B:0},lastQB:{A:null,B:null}},V=voidSet(g);
  for(const p of g.plays){
    if(V.has(p.id))continue;
    if(p.type==='half'){s.half=2;s.poss=other(g.first);s.down=1;continue}
    if(p.type==='firstdown'){s.down=1;continue}
    if(p.type==='turnover'){s.poss=other(s.poss);s.down=1;continue}
    if(p.type==='pen'){
      if(p.decision==='accept'){
        if(p.down==='first')s.down=1;
        else if(p.down==='loss'){s.down++;if(s.down>4){s.poss=other(s.poss);s.down=1}}
      }
      continue;
    }
    const off=p.off,def=other(off);
    if(p.qb!=null)s.lastQB[off]=p.qb;
    if(p.type==='int'){
      if(p.td){s.score[def]+=6;if(p.ep&&p.ep.ok)s.score[def]+=p.ep.pts;s.poss=off}else s.poss=def;
      s.down=1;continue;
    }
    /* セーフティ：守備側に2点。そのあとは守備側（点を取った側）の攻撃から */
    if(p.safety){s.score[def]+=2;s.poss=def;s.down=1;continue}
    if(p.td){s.score[off]+=6;if(p.ep&&p.ep.ok)s.score[off]+=p.ep.pts;s.poss=def;s.down=1;continue}
    /* フレッシュラインを越えたら第1ダウンへ（越えなければ4回で攻守交代） */
    if(p.fresh){s.down=1;continue}
    s.down++;if(s.down>4){s.poss=def;s.down=1}
  }
  return s;
}

function vDraft(g,s){

    case 'sloss':{let h='<button class="btn flag big" data-act="ssafety">エンドゾーン内 → セーフティ</button><div class="ygrid">';
      for(let y=0;y>=-15;y--)h+=`<button class="yb${y<0?' neg':' zero'}" data-act="pick" data-f="yards" data-n="${y}">${y}</button>`;

    case 'tdyds':q=d.type==='int'?'リターンTDまでのヤード':'TDまでのヤード（何ヤードからのTDか）';b=numGrid(1,50,'yards')+'<button class="btn ghost" data-act="skip">ヤードは記録しない</button>';break;
    case 'ep':{const sc=d.type==='int'?def:d.off;

    case 'pyds':q='罰則のヤード';b=numGrid(0,20,'pyds');break;

      b=`<p class="ask">${stripTags(describe(lp,g).t)}</p><p class="ask">プレー中の反則でプレーが取り消しになる場合は「無効にする」を選んでください。そのプレーのスタッツ・得点・ダウンは数えません。</p><div class="two"><button class="btn bad huge" data-act="set" data-f="voidId" data-v="${lp.id}">無効にする</button><button class="btn huge" data-act="set" data-f="voidId" data-v="">そのまま</button></div>`;break}
  }
  return `<section class="draft" aria-label="プレーの記録"><div class="crumbs">${cr.map(c=>`<span>${c}</span>`).join('')}</div><h2 class="q">${q}</h2>${b}
    <div class="row"><button class="btn ghost" data-act="dback">ひとつ戻る</button><button class="btn ghost" data-act="dcancel">${d.type==='pen'?'反則の記録をやめる':'このプレーをやめる'}</button></div></section>`;
}
function describe(p,g){
  if(p.type==='half')return{t:'後半開始',c:'ev'};
  if(p.type==='firstdown')return{t:'ダウン更新',c:'ev'};
  if(p.type==='turnover')return{t:'攻守交代',c:'ev'};
  if(p.type==='pen'){
    let t=`<span class="ptag">反則</span>${esc(p.kind)}${p.player!=null?' #'+p.player:''}　`;
    t+=p.decision==='accept'?`受諾 ${p.yards??0}yd・${DOWN[p.down]}`:'辞退';
    return{t,team:esc(g.teams[p.by])+' の反則',c:'pen'};
  }
  const ty=y=>y!=null?' '+y+'yd':'';
  let t='';
  if(p.type==='pass')t=`パス #${p.qb} → #${p.target}　${p.complete?(p.td?'成功・TD'+ty(p.yards):`成功 ${sgn(p.yards??0)}yd`):'失敗'+(p.why==='miss'?'（パスミス）':p.why==='cut'?`（カット${p.defender!=null?' 守備 #'+p.defender:''}）`:'')}`;
  if(p.type==='run')t=`ラン #${p.runner}　${p.td?'TD'+ty(p.yards):sgn(p.yards??0)+'yd'}`;
  if(p.type==='int')t=`インター QB #${p.qb} → 守備 #${p.defender}　${p.td?'リターンTD'+ty(p.yards):'リターン '+sgn(p.yards??0)+'yd'}`;
  if(p.type==='sack')t=`サック QB #${p.qb} ← 守備 ${p.defender!=null?'#'+p.defender:'（背番号なし）'}　${p.yards!=null?sgn(p.yards)+'yd':''}`;
  if(p.type==='safety')t=`セーフティ${p.defender!=null?' 守備 #'+p.defender:''}`;
  if(p.safety)t+=`／セーフティ ${esc(g.teams[other(p.off)])}に2点`;
  if(p.fresh)t+='／<b>フレッシュライン更新</b>';
  if(p.ep)t+=`／EP ${p.ep.pts}点 ${p.ep.ok?'成功':'失敗'}`;
  return{t,team:esc(g.teams[p.off])+' の攻撃',c:p.type};
}

/* ---------- stats ---------- */
function calc(g,half){
  const mk=()=>({qb:{},rec:{},run:{},def:{},pen:{},tot:{yds:0,pass:0,run:0,score:0,ints:0,sacks:0,saf:0,fd:0,pd:0,ep:{1:[0,0],2:[0,0]},pen:0,penYds:0}});
  const newQB=()=>({att:0,comp:0,yds:0,td:0,int:0,sack:0,sackYds:0,fd:0}),newDef=()=>({int:0,yds:0,td:0,sack:0,saf:0,pd:0});
  const T={A:mk(),B:mk()},get=(o,n,f)=>(o[n]??=f()),V=voidSet(g);
  for(const p of g.plays){
    if(V.has(p.id)||(half&&p.half!==half))continue;
    if(p.type==='pen'){
      const x=T[p.by],k=get(x.pen,p.kind,()=>({n:0,acc:0,yds:0}));k.n++;x.tot.pen++;
      if(p.decision==='accept'){k.acc++;k.yds+=p.yards||0;x.tot.penYds+=p.yards||0}
      continue;
    }
    if(!TYPE[p.type])continue;
    const o=T[p.off],d=T[other(p.off)];
    if(p.type==='pass'||p.type==='int'){
      const q=get(o.qb,p.qb,newQB);q.att++;o.tot.pass++;
      if(p.type==='pass'){
        const r=get(o.rec,p.target,()=>({tgt:0,rec:0,yds:0,td:0,fd:0}));r.tgt++;
        if(p.complete&&p.fresh){q.fd++;r.fd++;o.tot.fd++}
        if(!p.complete&&p.why==='cut'){d.tot.pd++;if(p.defender!=null)get(d.def,p.defender,newDef).pd++}
        if(p.complete){q.comp++;r.rec++;if(p.yards!=null){q.yds+=p.yards;r.yds+=p.yards;o.tot.yds+=p.yards}if(p.td){q.td++;r.td++}}
      }else{
        q.int++;const x=get(d.def,p.defender,newDef);x.int++;if(p.yards!=null)x.yds+=p.yards;if(p.td)x.td++;d.tot.ints++;
      }
    }
    if(p.type==='run'){const r=get(o.run,p.runner,()=>({att:0,yds:0,td:0,fd:0}));r.att++;if(p.fresh){r.fd++;o.tot.fd++}o.tot.run++;if(p.yards!=null){r.yds+=p.yards;o.tot.yds+=p.yards}if(p.td)r.td++}
    /* サック：QBの被サックとロスヤード、守備のサック数（パスの試投には数えない） */
    if(p.type==='sack'){
      const q=get(o.qb,p.qb,newQB);q.sack++;if(p.yards!=null)q.sackYds+=p.yards;d.tot.sacks++;
      if(p.defender!=null)get(d.def,p.defender,newDef).sack++;
    }
    /* セーフティ：守備側に2点 */
    if(p.safety){d.tot.score+=2;d.tot.saf++;if(p.defender!=null)get(d.def,p.defender,newDef).saf++}
    const sc=T[p.type==='int'?other(p.off):p.off].tot;
    if(p.td){sc.score+=6;if(p.ep){sc.ep[p.ep.pts][0]++;if(p.ep.ok){sc.ep[p.ep.pts][1]++;sc.score+=p.ep.pts}}}
  }
  return T;
}
function tbl(cap,head,rows,first='num'){
  if(!rows.length)return `<h3 class="h3">${cap}</h3><p class="note">記録なし</p>`;
  return `<h3 class="h3">${cap}</h3><div class="tw"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td>${i===0&&first==='num'?`<span class="num">#${c}</span>`:c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
const ent=o=>Object.entries(o).sort((a,b)=>a[0]-b[0]);
const pct=(a,b)=>b?Math.round(a/b*100)+'%':'-';
function vStats(){
  const g=game(),h=view.half||0,t=view.team||'A',T=calc(g,h),X=T[t];
  const b=`<div class="seg" role="tablist">${[[0,'試合合計'],[1,'前半'],[2,'後半']].map(([v,l])=>`<button class="${v===h?'on':''}" data-act="shalf" data-v="${v}" role="tab" aria-selected="${v===h}">${l}</button>`).join('')}</div>`;
  const tm=`<div class="seg teams" role="tablist">${['A','B'].map(x=>`<button class="t${x}${x===t?' on':''}" data-act="steam" data-t="${x}" role="tab" aria-selected="${x===t}">${esc(g.teams[x])}</button>`).join('')}</div>`;
  const ep=X.tot.ep;
  return `${bar('スタッツ','game')}
  <main class="gut"><div class="inner wrap">
    <p class="note">${fmtDate(g.date)}${g.event?'　'+esc(g.event):''}</p>
    ${b}
    <div class="sumbox"><div class="tA"><span class="stn">${esc(g.teams.A)}</span><b class="num">${T.A.tot.score}</b></div><span class="dash">-</span><div class="tB"><span class="stn">${esc(g.teams.B)}</span><b class="num">${T.B.tot.score}</b></div></div>
    <h2 class="sec">チームと選手の数字</h2>
    ${tm}
    <div class="kv">
      <div class="lead"><span>総獲得ヤード</span><b class="num">${X.tot.yds}</b></div>
      <div><span>パス／ラン</span><b class="num">${X.tot.pass} / ${X.tot.run}</b></div>
      <div><span>エクストラポイント 1点</span><b class="num">${ep[1][1]} / ${ep[1][0]}</b></div>
      <div><span>エクストラポイント 2点</span><b class="num">${ep[2][1]} / ${ep[2][0]}</b></div>
      <div><span>インターセプト（守備）</span><b class="num">${X.tot.ints}</b></div>
      <div><span>反則（罰則ヤード）</span><b class="num">${X.tot.pen}（${X.tot.penYds}yd）</b></div>
      <div><span>フレッシュライン更新</span><b class="num">${X.tot.fd}</b></div>
      <div><span>サック（守備）</span><b class="num">${X.tot.sacks}</b></div>
      <div><span>セーフティ（守備）</span><b class="num">${X.tot.saf}</b></div>
      <div><span>パスカット（守備）</span><b class="num">${X.tot.pd}</b></div>
    </div>
    <p class="note">表の「更新」は、そのプレーでフレッシュラインを越えた回数です。表は横にずらすと続きが見えます。</p>
    ${tbl('QB',['背番号','試投','成功','成功率','ヤード','TD','被INT','被サック','ロス','更新'],ent(X.qb).map(([n,q])=>[n,q.att,q.comp,pct(q.comp,q.att),q.yds,q.td,q.int,q.sack,q.sackYds,q.fd]))}
    ${tbl('レシーバー',['背番号','ターゲット','キャッチ','ヤード','TD','更新'],ent(X.rec).map(([n,r])=>[n,r.tgt,r.rec,r.yds,r.td,r.fd]))}
    ${tbl('ランナー',['背番号','回数','ヤード','平均','TD','更新'],ent(X.run).map(([n,r])=>[n,r.att,r.yds,r.att?(r.yds/r.att).toFixed(1):'-',r.td,r.fd]))}
    ${tbl('守備',['背番号','INT','リターン','リターンTD','サック','セーフティ','カット'],ent(X.def).map(([n,r])=>[n,r.int,r.yds,r.td,r.sack,r.saf,r.pd]))}
    ${tbl('反則',['種類','回数','受諾','罰則ヤード'],Object.entries(X.pen).sort((a,b)=>b[1].n-a[1].n).map(([k,r])=>[esc(k),r.n,r.acc,r.yds]),'text')}
    <h2 class="sec">共有</h2>
    <div class="row"><button class="btn primary" data-act="copysum">結果をコピー（LINE用）</button><button class="btn" data-act="copycsv">CSVをコピー</button></div>
    <details><summary>CSVを表示</summary><textarea id="csvBox" readonly>${esc(csv(g))}</textarea></details>
  </div></main>`;
}
function csv(g){
  const q=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const V=voidSet(g);
  const rows=[['試合日','前後半','攻撃チーム','種類','QB','レシーバー','ランナー','結果','ヤード','TD','守備選手（インター・サック・セーフティ・カット）','EP点','EP結果','反則チーム','反則','反則選手','処置','罰則ヤード','ダウン','無効','セーフティ','フレッシュライン']];
  for(const p of g.plays){
    if(p.type==='pen'){rows.push([g.date,p.half===2?'後半':'前半',g.teams[p.off],'反則','','','','','','','','','',g.teams[p.by],p.kind,p.player,p.decision==='accept'?'受諾':'辞退',p.decision==='accept'?p.yards:'',p.decision==='accept'?DOWN[p.down]:'','','','']);continue}
    if(!TYPE[p.type])continue;
    rows.push([g.date,p.half===2?'後半':'前半',g.teams[p.off],TYPE[p.type],p.qb,p.target,p.runner,p.type==='pass'?(p.complete?'成功':p.why==='cut'?'失敗（カット）':p.why==='miss'?'失敗（パスミス）':'失敗'):'',p.yards,p.td?'TD':'',p.defender,p.ep?p.ep.pts:'',p.ep?(p.ep.ok?'成功':'失敗'):'','','','','','','',V.has(p.id)?'無効':'',p.safety?g.teams[other(p.off)]+'に2点':'',p.fresh?'更新':'']);
  }
  return rows.map(r=>r.map(q).join(',')).join('\n');
}
function summary(g){
  const T=calc(g,0),H1=calc(g,1),H2=calc(g,2);
  let s=`${fmtDate(g.date)}${g.event?' '+g.event:''}\n${g.teams.A} ${T.A.tot.score} - ${T.B.tot.score} ${g.teams.B}\n（前半 ${H1.A.tot.score}-${H1.B.tot.score}／後半 ${H2.A.tot.score}-${H2.B.tot.score}）\n`;
  for(const x of ['A','B']){
    const X=T[x];s+=`\n■${g.teams[x]}　総獲得 ${X.tot.yds}yd　反則 ${X.tot.pen}${X.tot.sacks?'　サック '+X.tot.sacks:''}${X.tot.saf?'　セーフティ '+X.tot.saf:''}${X.tot.pd?'　パスカット '+X.tot.pd:''}${X.tot.fd?'　フレッシュライン更新 '+X.tot.fd:''}\n`;
    for(const [n,v] of ent(X.qb))s+=`QB #${n}　${v.comp}/${v.att}　${v.yds}yd　TD${v.td}　INT${v.int}${v.fd?'　更新'+v.fd:''}${v.sack?`　被サック${v.sack}（${v.sackYds}yd）`:''}\n`;
    for(const [n,v] of ent(X.rec))s+=`レシーバー #${n}　${v.rec}キャッチ　${v.yds}yd　TD${v.td}${v.fd?'　更新'+v.fd:''}\n`;
    for(const [n,v] of ent(X.run))s+=`ラン #${n}　${v.att}回　${v.yds}yd　TD${v.td}${v.fd?'　更新'+v.fd:''}\n`;
    for(const [n,v] of ent(X.def)){
      if(v.int)s+=`インター #${n}　${v.int}回　リターン${v.yds}yd\n`;
      if(v.sack)s+=`サック #${n}　${v.sack}回\n`;
      if(v.saf)s+=`セーフティ #${n}　${v.saf}回\n`;
      if(v.pd)s+=`カット #${n}　${v.pd}回\n`;
    }
  }
  return s.trim();
}
function copy(text,label){
  const fail=()=>{sheet={msg:'自動でコピーできませんでした。下の文字を長押ししてコピーしてください。',text};render()};
  try{navigator.clipboard.writeText(text).then(()=>toast(label+'をコピーしました')).catch(fail)}catch(e){fail()}
}

/* ---------- play flow ---------- */
const ORDER={pass:['qb','target','result','defender','yards','tdyds','ep'],run:['runner','yards','tdyds','ep'],int:['qb','defender','yards','tdyds','ep'],sack:['qb','defender','sloss'],safety:['defender'],pen:['by','kind','player','decision','pyds','pdown','void']};
function skipStep(st,d){
  const g=game();
  if(st==='defender'&&d.type==='pass'&&!(d.complete===false&&d.why==='cut'))return 'skip';
  if(st==='yards'&&d.type==='pass'&&!d.complete)return 'end';
  if(st==='sloss'&&d.safety)return 'end';
  if((st==='tdyds'||st==='ep')&&!d.td)return 'end';
  if(['pyds','pdown','void'].includes(st)&&d.decision!=='accept')return 'end';
  if(st==='void'&&!lastPlay(g))return 'end';
  return false;
}
function advance(){
  const d=draft,o=ORDER[d.type];
  let i=o.indexOf(d.step)+1;
  while(i<o.length&&skipStep(o[i],d)==='skip')i++;
  if(i>=o.length||skipStep(o[i],d))return commit();
  d.hist.push(d.step);d.step=o[i];render();
}
const CLEAR={qb:['qb'],target:['target'],runner:['runner'],defender:['defender'],result:['complete','why'],yards:['yards','td','fresh'],tdyds:['yards'],ep:['epPts'],sloss:['yards','safety'],
  by:['by'],kind:['kind'],player:['player'],decision:['decision'],pyds:['pyds'],pdown:['pdown'],void:['voidId']};
function stepBack(){
  const d=draft;d.fresh=null;
  if(d.step==='ep'&&d.epPts!=null){d.epPts=null;return}
  if(!d.hist.length){draft=null;return}
  d.step=d.hist.pop();for(const k of CLEAR[d.step])d[k]=null;
}
function commit(){
  const g=game(),d=draft,s=replay(g);
  let p;
  if(d.type==='pen'){
    p={id:uid(),type:'pen',off:d.off,half:s.half,by:d.by,kind:d.kind,player:d.player??null,decision:d.decision};
    if(d.decision==='accept'){p.yards=d.pyds??0;p.down=d.pdown||'repeat';if(d.voidId)p.voidId=d.voidId}
  }else{
    p={id:uid(),type:d.type,off:d.off,half:s.half,td:!!d.td};
    for(const k of ['qb','target','runner','defender','yards'])if(d[k]!=null)p[k]=d[k];
    if(d.type==='pass')p.complete=!!d.complete;
    if(d.type==='pass'&&!d.complete&&d.why){p.why=d.why;if(d.why!=='cut')delete p.defender}
    if(d.ep)p.ep=d.ep;
    if(d.type==='safety'||d.safety)p.safety=true;
    if(d.fresh&&!d.td&&(d.type==='run'||(d.type==='pass'&&d.complete)))p.fresh=true;
  }
  g.plays.push(p);save();draft=null;buzz();
  toast(p.type==='pen'?(p.voidId?'反則を記録し、直前のプレーを無効にしました':'反則を記録しました'):p.safety?'セーフティ（2点）を記録しました':p.fresh?'記録しました（フレッシュライン更新・第1ダウン）':p.td?(p.type==='int'?'リターンTDを記録しました':'TDを記録しました'):'記録しました');
  render();
}

/* ---------- render & events ---------- */
const VIEWS={home:vHome,new:vNew,roster:vRoster,game:vGame,stats:vStats,settings:vSettings};
function render(){
  if(!VIEWS[view.name]||(['roster','game','stats'].includes(view.name)&&!game()))view={name:'home'};
  document.body.dataset.view=view.name;
  document.getElementById('app').innerHTML=VIEWS[view.name]()+(sheet?vSheet():'');
  if(lastView!==view.name){window.scrollTo(0,0);lastView=view.name}
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b||b.disabled)return;
  if(b.classList.contains('scrim')&&e.target.closest('[data-stop]'))return;
  const a=b.dataset.act,n=b.dataset.n!=null?Number(b.dataset.n):null,g=game();
  switch(a){
    case 'new':view={name:'new'};draft=null;break;
    case 'go':view={name:b.dataset.to};break;
    case 'back':view={name:b.dataset.to,gameId:view.gameId};draft=null;break;
    case 'open':{const gg=db.games.find(x=>x.id===b.dataset.id);
      view=(!gg.roster.A.length||!gg.roster.B.length)?{name:'roster',gameId:gg.id,team:'A'}:{name:'game',gameId:gg.id};draft=null;wake();break}
    case 'stats':view={name:'stats',gameId:b.dataset.id,half:0,team:'A'};draft=null;break;
    case 'del':{const id=b.dataset.id,gg=db.games.find(x=>x.id===id);
      sheet={msg:`${fmtDate(gg.date)}「${esc(gg.teams.A)} 対 ${esc(gg.teams.B)}」を削除しますか？記録も消え、元に戻せません。`,ok:'削除する',danger:true,fn:()=>{db.games=db.games.filter(x=>x.id!==id);save();toast('削除しました')}};break}
    case 'rtab':view.team=b.dataset.t;break;
    case 'tognum':{const t=view.team||'A',r=g.roster[t],i=r.indexOf(n);if(i>=0)r.splice(i,1);else r.push(n);save();break}
    case 'rclear':g.roster[view.team||'A']=[];save();break;
    case 'rdone':db.rosters[g.teams.A]=[...g.roster.A];db.rosters[g.teams.B]=[...g.roster.B];save();view={name:'game',gameId:g.id};wake();break;
    case 'roster':view={name:'roster',gameId:g.id,team:replay(g).poss};break;
    case 'start':draft={type:b.dataset.t,off:replay(g).poss,step:ORDER[b.dataset.t][0],hist:[]};break;
    case 'pick':draft[b.dataset.f]=n;buzz();return advance();
    case 'set':draft[b.dataset.f]=b.dataset.v;buzz();return advance();
    case 'pkind':draft.kind=db.penKinds[Number(b.dataset.i)];buzz();return advance();
    case 'skip':buzz();return advance();
    case 'fresh':draft.fresh=!draft.fresh;buzz();break;
    case 'ssafety':draft.safety=true;draft.yards=null;buzz();return advance();
    case 'res':draft.complete=b.dataset.v==='1';draft.why=draft.complete?null:(b.dataset.w||null);buzz();return advance();
    case 'yard':draft.yards=n;draft.td=false;buzz();return advance();
    case 'ytd':draft.yards=null;draft.td=true;buzz();return advance();
    case 'eppts':draft.epPts=Number(b.dataset.v);break;
    case 'epok':draft.ep={pts:draft.epPts,ok:b.dataset.v==='1'};return commit();
    case 'ep':draft.ep={pts:Number(b.dataset.p),ok:b.dataset.v==='1'};buzz();return commit();
    case 'epskip':draft.ep=null;return commit();
    case 'dback':stepBack();break;
    case 'dcancel':draft=null;break;
    case 'firstdown':g.plays.push({id:uid(),type:'firstdown',half:replay(g).half});save();toast('第1ダウンに戻しました');break;
    case 'turnover':g.plays.push({id:uid(),type:'turnover',half:replay(g).half});save();toast('攻守を交代しました');break;
    case 'half':sheet={msg:'後半に切り替えますか？以降の記録は後半として集計されます。',ok:'後半へ',fn:()=>{g.plays.push({id:uid(),type:'half'});save();toast('後半開始')}};break;
    case 'undo':{const last=g.plays.at(-1),d=describe(last,g);g.plays.pop();save();toast('取り消し：'+stripTags(d.t));break}
    case 'logp':{const id=b.dataset.id,p=g.plays.find(x=>x.id===id);if(!p)break;
      sheet={msg:`この記録を削除しますか？<br><span class="note">${describe(p,g).t}</span>`,ok:'削除する',danger:true,fn:()=>{g.plays=g.plays.filter(x=>x.id!==id);save();toast('記録を削除しました')}};break}
    case 'shalf':view.half=Number(b.dataset.v);break;
    case 'steam':view.team=b.dataset.t;break;
    case 'copysum':return copy(summary(g),'結果');
    case 'copycsv':return copy(csv(g),'CSV');
    case 'savepen':{const list=document.getElementById('penList').value.split('\n').map(x=>x.trim()).filter(Boolean);
      if(!list.length){toast('1つ以上入力してください');return}db.penKinds=[...new Set(list)];save();toast('反則の種類を保存しました');break}
    case 'resetpen':db.penKinds=[...PEN_DEFAULT];save();toast('最初の一覧に戻しました');break;
    case 'backup':return copy(JSON.stringify(db),'全データ');
    case 'restore':{const txt=document.getElementById('restoreBox').value.trim();let d=null;
      try{d=JSON.parse(txt)}catch(err){}
      if(!d||!Array.isArray(d.games)){toast('データを読み取れませんでした。コピーした文字をそのまま貼り付けてください');return}
      sheet={msg:`${d.games.length}試合分のデータで置き換えますか？今この端末にあるデータは消えます。`,ok:'置き換える',danger:true,fn:()=>{d.rosters??={};d.penKinds??=[...PEN_DEFAULT];db=d;save();view={name:'home'};toast('データを戻しました')}};break}
    case 'sheetok':{const f=sheet&&sheet.fn;sheet=null;f&&f();break}
    case 'sheetcancel':sheet=null;break;
  }
  render();
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='fNew')return;
  e.preventDefault();
  const v=id=>(document.getElementById(id).value||'').trim();
  const A=v('fA'),B=v('fB');
  if(!A||!B)return toast('チーム名を入力してください');
  if(A===B)return toast('自チームと対戦相手は別の名前にしてください');
  const g={id:uid(),created:Date.now(),date:v('fDate')||today(),teams:{A,B},first:document.querySelector('input[name=fFirst]:checked').value,
    event:v('fEvent'),venue:v('fVenue'),roster:{A:[...(db.rosters[A]||[])],B:[...(db.rosters[B]||[])]},plays:[]};
  db.games.push(g);save();view={name:'roster',gameId:g.id,team:'A'};render();
});
render();
</script>
